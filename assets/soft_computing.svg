<circle cx="120" cy="80" r="40" stroke="#1A1A1A" stroke-width="8" fill="none"/>
<circle cx="100" cy="120" r="40" stroke="#1A1A1A" stroke-width="8" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
</svg>
